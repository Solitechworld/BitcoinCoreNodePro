  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">
    <rect x="64" y="52" width="276" height="28" rx="14" fill="none" stroke="#0e8f8f"/>
