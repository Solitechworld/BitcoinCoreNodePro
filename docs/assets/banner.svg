    <text x="20" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" fill="#00d9d9">28.1200<tspan fill="#2b3346"> BTC</tspan></text>
    <text x="20" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b96a8">your keys · your node · your rules</text>
