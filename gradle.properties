# Tuned for a normal development machine. If you build on a small VM (< 6 GB),
# see the note at the bottom.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is OFF deliberately. It writes temp files and then renames
# or deletes them, which fails on filesystems that disallow unlink -- including
# the mounted folder this project was developed in ("Operation not permitted").
# Turn it on if your working copy lives on a normal filesystem; it is a real
# speedup.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# NOTE: android.bundle.enableUncompressedNativeLibs used to be set here. It was
# removed in AGP 8.1 and now fails the build outright. The setting that actually
# matters lives in app/build.gradle.kts as:
#     packaging { jniLibs { useLegacyPackaging = true } }
# That is what makes the installer place a real, executable file at
# nativeLibraryDir -- the only directory Android lets us exec() from. Verified
# in the built APK: extractNativeLibs=true, native entries DEFLATED.
# Do not "optimise" it away.

# --- building on a memory-constrained machine ---
# Kotlin forks its own compile daemon. That JVM plus Gradle's plus KSP does not
# fit in ~4 GB: the kernel kills one mid-task and the build stops with no error
# message at all, which is a miserable thing to debug. If that happens, use:
#   org.gradle.jvmargs=-Xmx2400m -XX:MaxMetaspaceSize=768m
#   org.gradle.workers.max=1
#   org.gradle.parallel=false
#   kotlin.compiler.execution.strategy=in-process
#   kotlin.incremental=false
