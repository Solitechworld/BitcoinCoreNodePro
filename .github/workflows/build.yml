name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The app build only. The native payload is NOT built here: cross-compiling
  # Bitcoin Core takes 30-60 minutes and would blow past a free runner's budget
  # on every push. CI checks that the Kotlin compiles, the tests pass, and lint
  # is clean; the native artifact is built once, locally, and published with
  # the release.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Release builds assert the native payload exists. CI has no payload, so
      # it builds debug only and stubs the directory to keep packaging happy.
      - name: Stub jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          echo "CI stub, not a real binary" > app/src/main/jniLibs/arm64-v8a/libbitcoind.so
          echo "CI stub, not a real binary" > app/src/main/jniLibs/x86_64/libbitcoind.so

      - name: Verify RPC models against Bitcoin Core
        run: |
          if [ -d "$BITCOIN_SRC" ]; then
            python3 native/scripts/verify-rpc-models.py --core "$BITCOIN_SRC" --strict
          else
            echo "Bitcoin Core source not present in CI; skipping model verification."
            echo "Run it locally before every release."
          fi

      - name: Check for unimported identifiers
        run: python3 native/scripts/check-kotlin-imports.py app/src/main/java

      - run: ./gradlew --no-daemon lintDebug
      - run: ./gradlew --no-daemon testDebugUnitTest
      - run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
